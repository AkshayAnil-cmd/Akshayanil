        /* Animation Classes */
        .fade-in-section {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-section.is-visible { opacity: 1; transform: translateY(0); }
        
        /* Grid Filter Transitions */
        .gallery-item { transition: opacity 0.4s ease, transform 0.4s ease; }
        .gallery-item.hidden-item { display: none; }

        /* Shimmer Effect */
        .shimmer-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(100deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 80%);
            transform: translateX(-100%); transition: transform 1.2s ease; z-index: 1;
        }
        .group:hover .shimmer-overlay { transform: translateX(100%); }

        /* Mobile Nav */
        .nav-overlay { transform: translateY(-100%); transition: transform 0.5s ease-in-out; }
        .nav-overlay.open { transform: translateY(0); }

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile Menu
            const menuBtn = document.getElementById('menu-btn');
            const overlay = document.getElementById('menu-overlay');
            let isOpen = false;
            
            menuBtn.addEventListener('click', () => {
                isOpen = !isOpen;
                overlay.classList.toggle('open');
                menuBtn.innerHTML = isOpen 
                    ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>';
            });

            // --- GRID LOGIC ---
            const grid = document.getElementById('gallery-grid');
            const items = Array.from(grid.children);

            // 1. Assign Initial Indices for restoring order
            items.forEach((item, index) => {
                item.dataset.initialIndex = index;
            });

            // 2. Shuffle Function
            function shuffleItems() {
                const currentItems = Array.from(grid.children);
                for (let i = currentItems.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentItems[i], currentItems[j]] = [currentItems[j], currentItems[i]];
                }
                currentItems.forEach(item => grid.appendChild(item));
            }

            // 3. Reset Order Function
            function resetItemsOrder() {
                const currentItems = Array.from(grid.children);
                currentItems.sort((a, b) => {
                    return parseInt(a.dataset.initialIndex) - parseInt(b.dataset.initialIndex);
                });
                currentItems.forEach(item => grid.appendChild(item));
            }

            // 4. Initial Randomization for "All Works"
            shuffleItems();

            // Scroll Animation
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            
            document.querySelectorAll('.fade-in-section').forEach(el => observer.observe(el));
            
            // Footer Year
            const yearEl = document.getElementById('current-year');
            if(yearEl) yearEl.textContent = new Date().getFullYear();

            // Filtering
            const buttons = document.querySelectorAll('.filter-btn');
            const galleryItems = document.querySelectorAll('.gallery-item');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update Button Styles
                    buttons.forEach(b => {
                        b.classList.remove('bg-brand-gold-500', 'text-brand-dark');
                        b.classList.add('text-brand-gold-500');
                    });
                    btn.classList.remove('text-brand-gold-500');
                    btn.classList.add('bg-brand-gold-500', 'text-brand-dark');
                    
                    const filter = btn.dataset.filter;
                    
                    // Logic: 
                    // If "All Works" -> Shuffle for variety
                    // If Specific Category -> Reset to Original Order to prevent gaps
                    if (filter === 'all') {
                        shuffleItems();
                    } else {
                        resetItemsOrder();
                    }

                    // Apply Filter Visibility
                    galleryItems.forEach(item => {
                        if (filter === 'all' || item.dataset.category === filter) {
                            item.classList.remove('hidden-item');
                            setTimeout(() => {
                                item.style.opacity = '1';
                                item.style.transform = 'scale(1)';
                            }, 50);
                        } else {
                            item.style.opacity = '0';
                            item.style.transform = 'scale(0.95)';
                            setTimeout(() => item.classList.add('hidden-item'), 400);
                        }
                    });
                });
            });
        });
    </script>
